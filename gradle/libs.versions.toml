# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
spring-boot = "3.3.5"
flyway = "10.17.0"
jjwt = "0.12.6"
postgresql = "42.7.4"
testcontainers = "2.0.3"
mockwebserver = "4.12.0"
guava = "33.7.1-jre"
jackson = "3.0.3"
jackson-annotations = "2.20"
lombok = "1.18.42"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = 'guava'}

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# --- Spring Boot starters ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }

# --- Flyway ---
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# --- JWT (jjwt) ---
jjwt-api     = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwt-impl    = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# --- PostgreSQL JDBC ---
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# --- Test: Spring Boot starter ---
spring-boot-starter-test            = { module = "org.springframework.boot:spring-boot-starter-test",     version.ref = "spring-boot" }

# --- Test: Testcontainers ---
spring-boot-testcontainers           = { module = "org.springframework.boot:spring-boot-testcontainers",           version.ref = "spring-boot" }
testcontainers-junit-jupiter         = { module = "org.testcontainers:testcontainers-junit-jupiter",               version.ref = "testcontainers" }

# --- Test: MockWebServer ---
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }

# --- Jackson 3 (tools.jackson) ---
jackson-core     = { module = "tools.jackson.core:jackson-core",     version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }